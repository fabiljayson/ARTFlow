name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: artflow
          POSTGRES_PASSWORD: artflow_ci
          POSTGRES_DB: artflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artflow -d artflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://artflow:artflow_ci@127.0.0.1:5432/artflow_ci
      SECRET_KEY: ci-not-a-secret
      DEBUG: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Migrations check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Django system check
        run: uv run python manage.py check
      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend (oxlint + vitest + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint (oxlint)
        run: npm run lint
      - name: Tests (vitest)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
