[project]
name = "artflow-backend"
version = "0.1.0"
description = "ArtFlow — API marketplace d'art (Cameroun)"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "drf-spectacular>=0.28,<0.29",
    "psycopg[binary]>=3.2,<3.3",
    "django-environ>=0.12,<0.13",
    "argon2-cffi>=25.1,<26",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3,<4",
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.14,<0.15",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["config", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
